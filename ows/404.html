<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>404 Not Found</title>
        <style>
            h1,h2,p{
              text-align: center;
            }
        </style>
    </head>
    <body style="text-align: center; width: 80%; margin: auto;">
        <h1>404 Not Found</h1>
        <hr/>

            <hr/>
